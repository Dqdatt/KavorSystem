<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kavor HR Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: white rail + grey canvas; borderless white cards with one pale-green or deep-green card per screen for emphasis. Quantities are drawn as countable ticks, rings and calendars, never as filled bars. Tasks open in a centred dialog. */
:root{
  --bg:#F7F9F8; --surface:#FFFFFF; --surface-2:#F3F6F4; --surface-3:#E9EFEC;
  --line:#E7ECE9; --line-strong:#D0D9D4;
  --ink:#10241B; --ink-2:#476056; --ink-3:#789186;
  --brand:#0F5C46; --brand-strong:#0A4534; --brand-soft:#D9F1E5; --brand-ink:#0F5C46; --on-brand:#FFFFFF;
  --mint:#3BC39E; --mint-soft:#C9EBDB; --track:#DAE1DC;
  --ok:#168560; --ok-bg:#DAF2E5;
  --warn:#A86300; --warn-bg:#FFEFC9; --warn-fill:#F2A93B;
  --danger:#CF4444; --danger-bg:#FDE5E3;
  --info:#2E69D6; --info-bg:#E0ECFD; --info-fill:#5B8DEF;
  --violet:#6D52C7; --violet-bg:#ECE6FB;
  --t-gt:#6D52C7; --t-gt-bg:#ECE6FB; --t-np:#0B7F8F; --t-np-bg:#D7F0F3; --t-np-fill:#2BB5C4; --t-ot:#4B55C9; --t-ot-bg:#E4E6FB; --t-tu:#B03A74; --t-tu-bg:#FBE3EE; --t-hs:#7B6140; --t-hs-bg:#EFE7DA;
  --shadow-2:0 24px 60px -12px rgba(15,40,30,.28),0 4px 12px rgba(15,40,30,.06);
  --scrim:rgba(18,30,25,.45);
  --font-display:"Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1210; --surface:#151D19; --surface-2:#1B2520; --surface-3:#222E28;
    --line:#232F29; --line-strong:#33423A;
    --ink:#E9F0EC; --ink-2:#A8B6AF; --ink-3:#76857D;
    --brand:#3BC39E; --brand-strong:#5AD4B2; --brand-soft:#183528; --brand-ink:#7FE0C0; --on-brand:#06231A;
    --mint:#3BC39E; --mint-soft:#1E4B3C; --track:#28342E;
    --ok:#5AD3A2; --ok-bg:#143126;
    --warn:#EDB95A; --warn-bg:#3A2C10; --warn-fill:#E0A03C;
    --danger:#F08A8A; --danger-bg:#3B1B1B;
    --info:#8CB2F5; --info-bg:#172A4A; --info-fill:#5B8DEF;
    --violet:#B7A3F2; --violet-bg:#2A2247;
    --shadow-2:0 24px 60px -12px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#151D19; --surface-2:#1B2520; --surface-3:#222E28;
  --line:#232F29; --line-strong:#33423A;
  --ink:#E9F0EC; --ink-2:#A8B6AF; --ink-3:#76857D;
  --brand:#3BC39E; --brand-strong:#5AD4B2; --brand-soft:#183528; --brand-ink:#7FE0C0; --on-brand:#06231A;
  --mint:#3BC39E; --mint-soft:#1E4B3C; --track:#28342E;
  --ok:#5AD3A2; --ok-bg:#143126;
  --warn:#EDB95A; --warn-bg:#3A2C10; --warn-fill:#E0A03C;
  --danger:#F08A8A; --danger-bg:#3B1B1B;
  --info:#8CB2F5; --info-bg:#172A4A; --info-fill:#5B8DEF;
  --violet:#B7A3F2; --violet-bg:#2A2247;
  --shadow-2:0 24px 60px -12px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand-ink);font-weight:600}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;letter-spacing:-.015em;font-weight:700}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)} .small{font-size:12.5px} .strong{font-weight:700}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);display:flex;flex-direction:column;z-index:30;padding:20px 16px 16px}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 4px 22px 8px;min-height:58px}
.logo{color:var(--mint);display:grid;place-items:center;flex:none}
.brandrow b{font:800 20px var(--font-display);letter-spacing:-.02em}
.nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.nav h6{margin:12px 12px 4px;font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600;cursor:pointer;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand);color:var(--on-brand)}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center}
.nav a.on .cnt{background:var(--on-brand);color:var(--brand)}
.promo{background:var(--brand-soft);border-radius:18px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.promo b{font:700 15px/1.3 var(--font-display)}
.app.mini .hide-mini{display:none}
.app.mini .side{padding:20px 12px}
.app.mini .brandrow,.app.mini .nav a{justify-content:center;padding-left:0;padding-right:0}
.app.mini .logo{display:none}
.app.mini .nav h6{height:1px;background:var(--line);margin:10px 8px;overflow:hidden;color:transparent}
.app.mini .nav .cnt{position:absolute;top:2px;right:4px;min-width:16px;height:16px;font-size:10px;padding:0 4px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;padding:18px 28px 14px}
.top h1{font-size:22px;line-height:1.2}
.crumb{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb a{cursor:pointer;text-decoration:none;color:var(--brand-ink)}
.kbd{font:700 11px var(--font-body);border-radius:6px;padding:2px 6px;color:var(--ink-3);background:var(--surface-2)}
.searchbtn{display:flex;align-items:center;gap:10px;height:42px;padding:0 10px 0 14px;background:var(--surface);border-radius:12px;color:var(--ink-3);width:210px;text-align:left;flex:none}
.top .acts{display:flex;gap:8px;align-items:center}
.top .sep{width:1px;height:26px;background:var(--line-strong);margin:0 4px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.iconbtn:hover{color:var(--ink);background:var(--surface-3)}
.iconbtn.bare{background:transparent;width:36px;height:36px;border-radius:10px}
.iconbtn.more{width:36px;height:36px;border-radius:10px;background:transparent;color:var(--ink-2)}
.iconbtn.more:hover,.iconbtn.more[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}
.iconbtn.more.lg{width:42px;height:42px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-strong)}
.dd{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;white-space:nowrap}
.dd .ic{color:var(--ink-3);transition:transform .15s}
.dd[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--mint)}.dd[aria-expanded="true"] .ic{transform:rotate(180deg)}
.menu{position:fixed;z-index:90;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-2),0 0 0 1px var(--line);padding:6px;max-height:min(380px,70vh);overflow:auto;animation:fade .1s;display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;width:100%;text-align:left;font-weight:600;white-space:nowrap}
.menu button:hover{background:var(--surface-2)}
.menu button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.menu button.dg{color:var(--danger)}.menu button.dg:hover{background:var(--danger-bg)}
.iconbtn.tint{background:var(--brand-soft);color:var(--brand-ink)}
.iconbtn .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--brand-soft)}
.userchip{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:14px;text-align:left}
.userchip:hover{background:var(--surface)}
.userchip b{display:block;font-weight:700;line-height:1.2}
.main{padding:15px 28px 20px;width:100%;flex:1}
.app>div{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.main.fit{padding-bottom:12px}
.foot{position:sticky;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap;padding:12px 28px 14px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.foot>span:first-child{color:var(--ink-2);font-weight:700}
.foot button{color:var(--ink-3);font-weight:600}.foot button:hover{color:var(--brand-ink)}
.foot .ver{height:28px;padding:0 10px;border-radius:8px;background:var(--surface);color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.foot .live{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--ink-2);max-width:72ch}
.hello{align-items:flex-end}
.hello h2{font-size:28px;letter-spacing:-.02em}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface);font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);color:var(--on-brand);box-shadow:none}
.btn.pri:hover{background:var(--brand-strong)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.btn.soft:hover{background:var(--mint-soft)}
.btn.danger{color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--ink-2)}
.card>.hd .btn.ghost{color:var(--brand-ink);background:var(--surface-2)}.card>.hd .btn.ghost:hover{background:var(--brand-soft)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,textarea.input{height:44px;border:0;box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--surface);border-radius:12px;padding:0 14px;width:100%;min-width:0;font-weight:500}
textarea.input{height:auto;padding:12px 14px;resize:vertical;min-height:84px}
.input:focus,.select:focus{outline:0;box-shadow:inset 0 0 0 2px var(--mint)}
.input::placeholder{color:var(--ink-3)}
.input:disabled{background:var(--surface-2);color:var(--ink-3)}
select.select{appearance:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.lbl{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.fsec:first-child{margin-top:0}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap .ic{position:absolute;left:14px;color:var(--ink-3);pointer-events:none}
.inwrap .input{padding-left:42px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--mint)} .sw[aria-checked="true"]::after{transform:translateX(18px)}
.seg,.tabs{scrollbar-width:none;display:inline-flex;background:var(--surface);border-radius:14px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.card .seg{background:var(--surface-2)}
.seg button,.tabs button{height:36px;padding:0 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.seg button:hover,.tabs button:hover{color:var(--ink)}
.seg button.on,.tabs button.on{background:var(--brand);color:var(--on-brand)}
.seg .n,.tabs .n{font-size:11.5px;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-3);color:var(--ink-2);display:inline-grid;place-items:center}
.seg .on .n,.tabs .on .n{background:color-mix(in srgb,var(--on-brand) 22%,transparent);color:var(--on-brand)}
.tabs .n.hot{background:var(--danger);color:#fff}
.seg::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.tabs{margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.fchip:hover{background:var(--surface-3)}
.fchip.on{background:var(--brand-soft);color:var(--brand-ink)}
.fchip .n{font-weight:800;opacity:.7}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,32,24,.04)}
.card.tint{background:var(--brand-soft)}
.card.deep{background:var(--brand);color:var(--on-brand)}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 0}
.card>.hd h3{font-size:16px}
.card>.bd{padding:16px 22px 22px}
.card.pad{padding:20px 22px}
.inset{background:var(--surface-2);border-radius:14px;padding:14px 16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid>*,.stack>*,.page-head>div,.postcard>*{min-width:0}
.grid>.stack>.card:last-child{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:var(--r);padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.kpi:first-child{background:var(--brand-soft)}
button.kpi:hover{box-shadow:inset 0 0 0 2px var(--mint)}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:10px;min-height:40px}
.kpi .l .ic{width:40px;height:40px;padding:11px;border-radius:50%;background:var(--surface-2);color:var(--ink-2)}
.kpi:first-child .l .ic{background:var(--brand);color:var(--on-brand)}
.kpi .v{font:800 32px/1.15 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .v small{font:600 15px var(--font-body);color:var(--ink-3);letter-spacing:0}
.kpi .d{font-size:12.5px;color:var(--ink-3)}
.kpi .tone-warn{color:var(--warn)} .kpi .tone-danger{color:var(--danger)} .kpi .tone-ok{color:var(--ok)}
.kpi .go{position:absolute;right:16px;top:18px;color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.info{background:var(--info-bg);color:var(--info)} .badge.violet{background:var(--violet-bg);color:var(--violet)} .badge.brand{background:var(--brand-soft);color:var(--brand-ink)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.av.s{width:26px;height:26px;font-size:10px} .av.l{width:48px;height:48px;font-size:15px} .av.xl{width:96px;height:96px;font-size:30px;border-radius:26px}
.av.c0{background:#CFEBDD;color:#0F5C46} .av.c1{background:#D9E6FB;color:#274F9E} .av.c2{background:#FBE7C2;color:#8A5200} .av.c3{background:#E5DDF8;color:#55409F} .av.c4{background:#FADADA;color:#A33636} .av.c5{background:#D5EEF0;color:#17616B}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-weight:700;line-height:1.3} .who .grow>span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.3;font-weight:500}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--warn-bg);align-items:flex-start}
.note .ic{color:var(--warn);margin-top:1px}
.note.info{background:var(--info-bg)}.note.info .ic{color:var(--info)}
.note.ok{background:var(--ok-bg)}.note.ok .ic{color:var(--ok)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ring{width:60px;height:60px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-ink);margin-bottom:6px}
.empty b{color:var(--ink);font:700 16px var(--font-display)}
.empty p{max-width:46ch}
/* countable marks instead of bars */
.ticks{display:inline-flex;flex-wrap:wrap;row-gap:4px;max-width:100%;gap:3px;align-items:stretch;height:22px;vertical-align:middle}
.ticks i{width:5px;min-height:14px;border-radius:2.5px;background:var(--track)}
.postcard .ticks{flex-wrap:nowrap;gap:2px}.postcard .ticks i{width:4px}
.ticks.lg{height:30px;gap:4px}.ticks.lg i{width:6px;border-radius:3px}
.ticks.sm{height:14px}.ticks.sm i{width:4px}
.ticks .a{background:var(--brand)} .ticks .m{background:var(--mint)} .ticks .w{background:var(--warn-fill)} .ticks .d{background:var(--danger)} .ticks .i{background:var(--t-np-fill)}
.card.deep .ticks i{background:color-mix(in srgb,var(--on-brand) 22%,transparent)} .card.deep .ticks .m{background:var(--mint)}
.ringw{position:relative;display:inline-grid;place-items:center;flex:none}
.ringw svg{display:block;transform:rotate(-90deg)}
.ringw .c{position:absolute;text-align:center;line-height:1.1}
.ringw .c b{font:800 20px var(--font-display);display:block;font-variant-numeric:tabular-nums} .ringw .c span{font-size:11px;color:var(--ink-3);font-weight:600}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dots i{aspect-ratio:1;border-radius:7px;background:var(--track)}

/* ---------- table ---------- */

.toolbar .fchip,.toolbar .seg button{height:auto;min-height:60px;align-self:stretch;padding:0 10px;border-radius:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink-3);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}

.toolbar .fchip .n,.toolbar .seg .n{font-size:11.5px;font-weight:800;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-3);color:var(--ink-2);display:inline-grid;place-items:center;opacity:1}
.toolbar .on .n{background:var(--brand-soft);color:var(--brand-ink)}
.toolbar .legend{order:4;margin-left:auto}.toolbar .legend~.inwrap,.toolbar .legend~.dd{margin-left:0}
.tog{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);flex:none}
.tog.on{background:var(--brand-soft);color:var(--brand-ink)}
.tblwrap{overflow-x:auto;padding:0 10px 8px}
.card>.tblwrap:first-child{padding-top:8px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--ink-3);padding:12px 12px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tbody tr.click:hover td:first-child{border-radius:12px 0 0 12px}.tbl tbody tr.click:hover td:last-child{border-radius:0 12px 12px 0}
.tbl .r{text-align:right} .tbl .c{text-align:center}
.tbl tr.grp td{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:18px 12px 6px;border-bottom:0}
.tbl tr.sel td{background:var(--brand-soft)}
.tbl .act{white-space:nowrap;text-align:right;color:var(--ink-3);width:60px}.tbl .act .iconbtn{margin-left:auto}

.cb:hover{box-shadow:inset 0 0 0 1.5px var(--mint)}
.cb:checked{background:var(--brand);box-shadow:none}
.cb:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-brand);border-bottom:2px solid var(--on-brand);transform:translateY(-1px) rotate(-45deg)}
.bulk{display:flex;align-items:center;gap:12px;padding:10px 16px;margin:0 20px 12px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700}

.dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr}

.tile.danger{color:var(--danger);background:var(--danger-bg)} .tile.warn{color:var(--warn);background:var(--warn-bg)} .tile.info{color:var(--info);background:var(--info-bg)} .tile.ok{color:var(--ok);background:var(--ok-bg)} .tile.brand{color:var(--brand-ink);background:var(--brand-soft)} .tile.violet{color:var(--violet);background:var(--violet-bg)}
.tile.s{width:30px;height:30px}

/* ---------- timeline / steps ---------- */
.tl{display:flex;flex-direction:column}
.tl>div{display:grid;grid-template-columns:24px 1fr;gap:14px;padding-bottom:18px;position:relative}
.tl>div::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.tl>div:last-child{padding-bottom:0}.tl>div:last-child::before{display:none}
.tl .pt{width:24px;height:24px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3);z-index:1;font-size:11.5px;font-weight:800}

.step.now{background:var(--brand);color:var(--on-brand)} .step.now span{color:color-mix(in srgb,var(--on-brand) 80%,transparent)} .step.now a{color:var(--on-brand)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px 16px;animation:fade .15s}

.modal{width:min(640px,100%);max-height:100%;background:var(--surface);border-radius:24px;display:flex;flex-direction:column;box-shadow:var(--shadow-2);animation:pop .18s ease-out;overflow:hidden}

.modal>footer{padding:16px 28px 24px;display:flex;justify-content:flex-end;gap:10px}
.pop{position:fixed;z-index:60;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-2);width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 100px);overflow:auto;animation:fade .12s}
.cmdk{width:min(620px,100%);background:var(--surface);border-radius:22px;box-shadow:var(--shadow-2);overflow:hidden}

.cmdk .res button:hover,.cmdk .res button.on{background:var(--brand-soft)}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-2);display:flex;gap:10px;align-items:center;animation:rise .2s}
.toast .ic{color:var(--mint)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}} @keyframes rise{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mapbox{height:190px;border-radius:16px;position:relative;overflow:hidden;background:

 linear-gradient(var(--surface),var(--surface)) 30% 0/10px 100% no-repeat,
 linear-gradient(var(--surface),var(--surface)) 72% 0/6px 100% no-repeat,
 linear-gradient(var(--surface),var(--surface)) 0 78%/100% 6px no-repeat,var(--surface-3)}

function cmdItems(q){q=(q||'').toLowerCase();const m=s=>s.toLowerCase().includes(q);
  const pages=NAV.flatMap(g=>g[1]).filter(p=>m(p[1])).map(p=>({g:'Trang',i:p[2],t:p[1],a:'go:'+p[0]}));
  const acts=[['plus','Thêm nhân viên','ov:emp-new'],['send','Gửi lời mời kích hoạt app','ov:invite'],['calc','Tính thử lương','tabgo:luong:luong:calc'],['lock','Khóa kỳ công 11/2026','ov:lock'],['news','Tạo bài viết bản tin','ov:post-new']].filter(a=>m(a[1])).map(a=>({g:'Thao tác nhanh',i:a[0],t:a[1],a:a[2]}));
  const emps=(q?E.filter(e=>m(e.name)||m(e.code)):[]).slice(0,6).map(e=>({g:'Nhân viên',e,t:e.name,s:e.code+'<i class=vs></i>'+deptName(e.dept),a:'emp:'+e.code}));
  const reqs=(q?REQS.filter(r=>m(r.id)):[]).slice(0,4).map(r=>({g:'Đơn',i:'approve',t:r.id+'<i class=vs></i>'+REQ_TYPES[r.type],s:empBy(r.who).name,a:'req:'+r.id}));
  return[...emps,...reqs,...acts,...pages]}
function cmdList(q){const it=cmdItems(q);if(!it.length)return empty('search','Không tìm thấy','Thử tên, mã nhân viên hoặc mã đơn như GT-0004.');let g='';return it.map((x,i)=>`${x.g!==g?(g=x.g,`<h6>${x.g}</h6>`):''}<button class="${i===0?'on':''}" data-a="${x.a}">${x.e?av(x.e,'s'):`<span class="tile" style="width:28px;height:28px">${ic(x.i,15)}</span>`}<span class="grow"><b style="font-weight:600">${x.t}</b>${x.s?` <span class="muted small">${x.s}</span>`:''}</span>${i===0?'<span class="kbd">Enter</span>':''}</button>`).join('')}

function act(a,el){
  const [n,...r]=a.split(':');const x=r[0];
  switch(n){
    case'go':go(x);break;
    case'tab':S.tab[x]=r[1];render();break;
    case'tabgo':S.tab[r[1]]=r[2];go(x);break;
    case'emp':S.emp=x;S.tab.hs='tq';go('ho-so');break;
    case'ov':S.ov={name:x,arg:r[1]};S.pop=null;render();break;
    case'pop':S.pop=S.pop===x?null:x;render();break;
    case'close':S.ov=null;S.pop=null;render();break;
    case'done':S.ov=null;render();toast(r.join(':'));break;
    case'toast':toast(r.join(':'));break;
    case'cmdk':S.ov={name:'cmdk'};S.pop=null;render();break;
    case'mini':S.mini=!S.mini;render();break;
    case'nav':S.navopen=!S.navopen;render();break;
    case'theme':if(x==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=x;try{localStorage.setItem('kavor-theme',x)}catch(e){}render();break;
    case'sw':el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true');break;
    case'quick':S.quick=x;S.selE.clear();render();break;
    case'grp':S.grp=!S.grp;render();break;
    case'selall':{const l=empFiltered();const all=l.every(e=>S.selE.has(e.code));l.forEach(e=>all?S.selE.delete(e.code):S.selE.add(e.code));render();break}
    case'sel':S.selE.has(x)?S.selE.delete(x):S.selE.add(x);render();break;
    case'invite':{const n=S.selE.size||E.filter(e=>e.acct==='none').length;(S.selE.size?[...S.selE].map(empBy):E).forEach(e=>{if(e.acct==='none')e.acct='invited'});S.selE.clear();S.ov=null;render();toast(`Đã gửi lời mời tới ${n} nhân viên`);break}
    case'req':S.req=x;if(S.route!=='don-tu'){const q=REQS.find(k=>k.id===x);S.tab.don=q.st!=='pending'?'done':q.mine?'mine':'wait';go('don-tu')}else{S.ov=null;render()}break;
    case'approve':case'reject':{const q=REQS.find(k=>k.id===x);q.st=n==='approve'?'approved':'rejected';q.overdue=0;q.flow.forEach(f=>{if(f[2]==='now'){f[2]=n==='approve'?'done':'bad';f[3]='13/11 09:37'}});const nx=REQS.find(k=>k.st==='pending'&&k.mine);if(nx)S.req=nx.id;render();toast(n==='approve'?`Đã duyệt ${x}`:`Đã từ chối ${x}`);break}
    case'role':S.role=x;render();break;
    case'ptg':{const ro=ROLES.find(q=>q.id===S.role);S.pd=S.pd||{};const d=S.pd[ro.id]||(S.pd[ro.id]={...ro.p});const c=r[1];let v=d[x]||'';const has=v.includes(c);const ord='vsa';if(has){v=ord.split('').filter(ch=>ord.indexOf(ch)<ord.indexOf(c)&&v.includes(ch)).join('')}else{v=ord.split('').filter(ch=>ord.indexOf(ch)<=ord.indexOf(c)).join('')+''}d[x]=v;render();break}
    case'psave':{const ro=ROLES.find(q=>q.id===S.role);if(S.pd&&S.pd[ro.id]){ro.p={...S.pd[ro.id]};delete S.pd[ro.id]}render();toast('Đã lưu quyền cho vai trò '+ro.name);break}
    case'preset':{S.pd&&delete S.pd[S.role];render();break}
    case'set':S.tab.set=x;go('cai-dat');break;
    case'docok':{const e=empBy(S.emp);if(e.docs<4)e.docs++;render();toast('Đã đánh dấu đã nộp');break}
    case'apg':S.apg=S.apg||{};S.apg[x]=+r[1];render();break;case'filt':S.tab[x]=r[1];if(x==='npf')S.tab.npg='1';if(x==='lf')S.tab.lpg='1';render();break;
    case'calcset':S.calc.gross=x*1e6;render();break;
    case'lday':S.lday=+x;if(S.route!=='nghi-phep'){S.tab.np='cal';go('nghi-phep')}else render();break;
    case'auth':authAct(x,r[1],el);break;
    case'lmo':S.lmo=+x;render();break;
    case'bankshow':S.bankshow=1;render();break;
    case'allowon':{ALLOW[+x][6]=1;render();toast('Đã bật lại '+ALLOW[+x][0]);break}
    case'empdoc':S.emp=x;S.tab.hs='gt';go('ho-so');break;
  }}

  if(MENU)closeMenu();

  if(el.dataset.self&&ev.target!==el)return;
  if(el.tagName==='A')ev.preventDefault();
  if(S.pop&&!el.closest('.pop')&&!el.dataset.a.startsWith('pop:')){S.pop=null;if(el.dataset.a.startsWith('toast')){const a=el.dataset.a;render();act(a);return}}
  act(el.dataset.a,el)});

document.addEventListener('keydown',ev=>{
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();act('cmdk')}
  else if(ev.key==='Escape'&&MENU){closeMenu()}
  else if(ev.key==='Escape'&&(S.ov||S.pop)){act('close')}
  else if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.lg){const v=S.lg&&S.lg.view;authAct(v==='forgot'?'send':v==='activate'?'activate':'login')}
  else if(ev.key==='Enter'&&ev.target.id==='cmdq'){const b=$('#cmdres button');if(b)b.click()}});
window.addEventListener('scroll',ev=>{if(MENU&&!(ev.target.closest&&ev.target.closest('.menu')))closeMenu()},true);
let _rz;window.addEventListener('resize',()=>{closeMenu();fit();clearTimeout(_rz);_rz=setTimeout(()=>{if((S.route==='luong'||S.route==='nghi-phep')&&(!S.rpp||S.rpp==='auto')&&typeof rpp==='function'&&S._rl!==rpp()){S._rl=rpp();render()}},150)});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(PAGES[r]&&r!==S.route){if(r==='ho-so'&&!S.emp)S.emp='NV0007';go(r)}});
function boot(){try{const t=localStorage.getItem('kavor-theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}
  const r=location.hash.slice(1);S.auth=PAGES[r]?'in':'out';if(PAGES[r]){S.route=r;if(r==='ho-so')S.emp='NV0007'}render()}

function empFiltered(){const f=QUICK.find(q=>q[0]===S.quick)[2],q=S.q.toLowerCase();return E.filter(e=>f(e)&&(!S.dept||e.dept===S.dept)&&(!q||e.name.toLowerCase().includes(q)||e.code.toLowerCase().includes(q)))}
const docBar=e=>`<span class="row" style="gap:10px">${ticks(4,[[e.docs,e.docs>=4?'m':'a']],'sm')}<span class="small num ${e.docs>=4?'':'sub'}" style="${e.docs>=4?'color:var(--ok);font-weight:700':''}">${e.docs>=4?'Đủ':e.docs+'/4'}</span></span>`;
const acctTxt=a=>a==='active'?`${badge('Đã kích hoạt','ok')}`:a==='invited'?`${badge('Đã mời','info')}`:`<span class="muted small">Chưa mời</span>`;
function empTable(){
  const l=empFiltered();if(!l.length)return empty('users','Không có nhân viên phù hợp','Thử bỏ bớt bộ lọc hoặc tìm theo mã nhân viên.',btn('Xóa bộ lọc','quick:all','sm'));
  const rowH=e=>`<tr class="click ${S.selE.has(e.code)?'sel':''}" data-a="emp:${e.code}"><td style="width:36px"><input type="checkbox" class="cb" id="cb${e.code}" aria-label="Chọn ${e.name}" ${S.selE.has(e.code)?'checked':''} data-a="sel:${e.code}"></td><td>${who(e,e.code)}</td><td><b style="font-weight:500;display:block">${e.title}</b><span class="small muted">${deptName(e.dept)}</span></td><td class="num">${e.joined}<span class="small muted" style="display:block">${tenure(e.joined)}</span></td><td>${e.contract==='Thử việc'?badge('Thử việc','violet'):'<span class="sub">Chính thức</span>'}</td><td>${docBar(e)}</td><td>${acctTxt(e.acct)}</td><td class="act">${ic('chevR',16)}</td></tr>`;
  let body='';
  if(S.grp&&!S.q){DEPTS.forEach(d=>{const g=l.filter(e=>e.dept===d.id);if(g.length)body+=`<tr class="grp"><td colspan="8">${d.name}<i class=vs></i>${g.length} người</td></tr>`+g.map(rowH).join('')})}else body=l.map(rowH).join('');
  const sel=S.selE.size;
  return `${sel?`<div class="bulk">${sel} người đã chọn<span class="grow"></span>${btn('Gửi lời mời','ov:invite','sm pri','send')}${btn('Nhắc bổ sung giấy tờ','toast:Đã gửi nhắc bổ sung giấy tờ','sm')}${btn('Bỏ chọn','quick:'+S.quick,'sm ghost')}</div>`:''}

  <div class="tfoot"><span>Hiển thị ${l.length} / ${E.length} hồ sơ</span><span>Trạng thái Đang làm việc là mặc định nên không hiển thị trên từng dòng</span></div>`}

const allowOf=e=>730000+(/Giám sát|Quản lý|Leader|Giám đốc|Trưởng/.test(e.title)?570000:0)+(e.code==='2402'?5000000:0);
function calcPay(){const c=S.calc,g=Math.max(0,+String(c.gross).replace(/\D/g,'')||0),dep=Math.max(0,+c.dep||0);
  if(c.ct==='0'){const tax=g>=2000000?g*.1:0;return{g,short:true,ins:0,tax,net:g-tax,cost:g,rows:[],co:[],taxable:g}}
  const base=Math.min(g,46800000),bhxh=base*.08,bhyt=base*.015,bhtn=base*.01,un=c.union?base*.005:0,ins=bhxh+bhyt+bhtn+un;
  const taxable=Math.max(0,g-ins-15500000-dep*6200000);let tax=0,prev=0;for(const [cap,rate] of [[10e6,.05],[30e6,.1],[60e6,.2],[100e6,.3],[Infinity,.35]]){if(taxable>prev)tax+=(Math.min(taxable,cap)-prev)*rate;prev=cap}
  const co=[['BHXH (công ty) 17,5%',base*.175],['BHYT (công ty) 3%',base*.03],['BHTN (công ty) 1%',base*.01],['Kinh phí công đoàn 2%',base*.02]];
  return{g,ins,tax,net:g-ins-tax,cost:g+co.reduce((a,x)=>a+x[1],0),taxable,dep,rows:[['BHXH 8%',bhxh],['BHYT 1,5%',bhyt],['BHTN 1%',bhtn],...(un?[['Đoàn phí 0,5%',un]]:[])],co}}
function calcOut(){const r=calcPay();if(!r.g)return empty('calc','Nhập tổng thu nhập để tính','Kết quả cập nhật ngay khi bạn gõ.');const p=x=>Math.max(x/r.g*100,0);

  <div class="receipt"><div class="ln"><b>Tổng thu nhập</b><b class="num">${money(r.g)}</b></div>${r.rows.map(x=>`<div class="ln"><span class="sub">${x[0]}</span><span class="num">− ${money(x[1])}</span></div>`).join('')}
  <div class="ln"><span>Thuế TNCN<small>${r.short?'Khấu trừ 10% trên tổng thu nhập, không đóng bảo hiểm':`Thu nhập tính thuế ${money(r.taxable)} = thu nhập − bảo hiểm − giảm trừ bản thân 15.500.000 ₫${r.dep?` − ${r.dep} người phụ thuộc × 6.200.000 ₫`:''}`}</small></span><span class="num">− ${money(r.tax)}</span></div><div class="ln total"><span>Thực nhận</span><span class="num">${money(r.net)}</span></div></div>
  ${r.co.length?`<details><summary class="spread sub" style="cursor:pointer;font-weight:600">Công ty đóng thêm ${money(r.cost-r.g)}${ic('chevD',16)}</summary><div class="receipt" style="margin-top:6px">${r.co.map(x=>`<div class="ln"><span class="sub">${x[0]}</span><span class="num">${money(x[1])}</span></div>`).join('')}</div></details>`:''}

function authAct(k,arg,el){const L=S.lg||(S.lg={view:'login',err:{},sent:0}),val=id=>{const x=document.getElementById(id);return x?x.value.trim():''};
  const keep=()=>{const u=val('lgu');if(u)L.u=u};
  if(k==='eye'){const i=document.getElementById('lgp');if(i)i.type=i.type==='password'?'text':'password';return}
  if(k==='view'){keep();L.view=arg;L.err={};L.sent=0;render();return}
  if(k==='resend'){toast('Đã gửi lại liên kết đặt lại mật khẩu');return}
  if(k==='out'){S.auth='out';S.pop=null;S.ov=null;L.view='login';L.err={};try{history.replaceState(null,'',location.pathname)}catch(e){}render();return}
  keep();const u=val('lgu'),p=val('lgp'),err={};
  if(k==='login'){if(!u)err.u='Nhập mã nhân viên hoặc email công ty';if(!p)err.p='Nhập mật khẩu'}
  if(k==='send'){if(!u)err.u='Nhập mã nhân viên hoặc email công ty'}
  if(k==='activate'){if(!u)err.u='Nhập mã nhân viên hoặc email công ty';if(!val('lgc'))err.c='Nhập mã mời trong email';if(p.length<8)err.p='Mật khẩu cần tối thiểu 8 ký tự'}

  if(k==='send'){L.sent=1;render();return}

function smooth(p){if(p.length<2)return'';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0]},${c[1]}`}return d}

  const px=X(sel),tw=156,tx=Math.min(Math.max(px-tw/2,x0),x1-tw+8),ty=Y(hard[sel])-98>y0?Y(hard[sel])-98:Y(hard[sel])+16;
  const row=(c,l,v,k)=>`<circle cx="${tx+16}" cy="${ty+38+k*19}" r="4" fill="${c}"/><text x="${tx+28}" y="${ty+42+k*19}" class="tl">${l}</text><text x="${tx+tw-12}" y="${ty+42+k*19}" text-anchor="end" class="tv">${vn(v)} tr</text>`;
  const tip=`<g><line x1="${px}" x2="${px}" y1="${y0}" y2="${y1}" stroke="var(--ink-3)" stroke-dasharray="3 4" opacity=".6"/><circle cx="${px}" cy="${Y(hard[sel])}" r="5.5" fill="#fff" stroke="#3BC39E" stroke-width="3"/><g filter="url(#ps)"><rect x="${tx}" y="${ty}" width="${tw}" height="88" rx="12" fill="var(--surface)" stroke="var(--line)"/></g><text x="${tx+14}" y="${ty+22}" class="tt">Tháng ${sel+1}/2026</text>${row('#3BC39E','Lương cứng',hard[sel],0)}${row('#0F5C46','Phụ cấp',alw[sel],1)}${row('#F2A93B','Làm thêm',ot[sel],2)}</g>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="pchart" role="img" aria-label="Biểu đồ quỹ lương 11 tháng"><defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3BC39E" stop-opacity=".26"/><stop offset="1" stop-color="#3BC39E" stop-opacity="0"/></linearGradient><filter id="ps" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10241B" flood-opacity=".14"/></filter></defs>${grid}${xl}${area}${L(hard,'#3BC39E',2.6)}${L(alw,'#0F5C46',2.2)}${L(ot,'#F2A93B',2.2)}${tip}${hit}</svg>`}
function payMix(){
  const tb=E.reduce((a,e)=>a+e.base,0),ta=E.reduce((a,e)=>a+allowOf(e),0),ot=E.reduce((a,e)=>a+OTof(e),0),adv=3000000,tot=tb+ta+ot+adv;
  const parts=[['Lương cơ bản',tb,'#3BC39E'],['Phụ cấp',ta,'#0F5C46'],['Làm thêm giờ',ot,'#F2A93B'],['Tạm ứng',adv,'#C9D3CE']];
  let ticks=[],left=100;parts.forEach(([,v],i)=>{const n=i===parts.length-1?left:Math.max(1,Math.round(v/tot*100));left-=n;ticks.push(...Array(n).fill(parts[i][2]))});
  return `<div class="pmx-t"><b class="num">${money(tb+ta+ot)}</b><span class="sub small">Tổng quỹ lương tháng 11</span></div><div class="brk" aria-hidden="true">${ticks.slice(0,100).map(c=>`<i style="background:${c}"></i>`).join('')}</div>
  <div class="pmx-l">${parts.map(([l,v,c])=>`<div><span class="sq" style="background:${c}"></span><span class="lb">${l}<b>${vn(v/tot*100)}%</b></span><span class="am num">${money(v)}</span></div>`).join('')}</div>`}
function rpp(){const v=S.rpp;if(v&&v!=='auto')return +v;return Math.max(5,Math.min(8,Math.floor((innerHeight-330)/58)))}
function pagerHTML(key,pg,np,total,per,unit){const pages=[];for(let i=1;i<=np;i++){if(i===1||i===np||Math.abs(i-pg)<=1||(pg<=3&&i<=4)||(pg>=np-2&&i>=np-3))pages.push(i);else if(pages[pages.length-1]!=='…')pages.push('…')}
  const sel=['auto',5,8,10,15].map(o=>`<option value="${o}" ${String(S.rpp||'auto')===String(o)?'selected':''}>${o==='auto'?'Tự động ('+rpp()+')':o}</option>`).join('');
  return `<div class="tfoot spread"><span class="sub small row" style="gap:10px">Hiển thị <select class="rppsel" data-in="rpp" aria-label="Số dòng mỗi trang">${sel}</select> ${total?(pg-1)*per+1:0} đến ${Math.min(pg*per,total)} trên ${total} ${unit}</span><span class="pager"><button ${pg<=1?'disabled':''} data-a="filt:${key}:${pg-1}" aria-label="Trang trước">${ic('chevL',16)}</button>${pages.map(i=>i==='…'?'<span class="pgdots">…</span>':`<button class="${i===pg?'on':''}" data-a="filt:${key}:${i}">${i}</button>`).join('')}<button ${pg>=np?'disabled':''} data-a="filt:${key}:${pg+1}" aria-label="Trang sau">${ic('chevR',16)}</button></span></div>`}
function payRows(){const f=curTab('lf','all'),q=(S.lsq||'').trim().toLowerCase(),need=e=>monthOf(e).miss||!e.base;
  return E.filter(e=>(f==='all'||(f==='need'&&need(e))||(f==='trial'&&e.contract==='Thử việc'))&&(!q||(e.name+' '+e.code+' '+e.title).toLowerCase().includes(q)))}
function payTable(){const l=payRows(),PER=rpp(),np=Math.max(1,Math.ceil(l.length/PER)),pg=Math.min(Math.max(1,+curTab('lpg','1')),np),rows=l.slice((pg-1)*PER,pg*PER);
  return `<div class="tblwrap"><table class="tbl pay"><thead><tr><th>Nhân viên</th><th>Chức danh</th><th class="r">Lương cơ bản</th><th class="r">Phụ cấp</th><th class="r">Làm thêm</th><th class="r">Tạm ứng</th><th class="r">Tổng dự kiến</th><th>Trạng thái</th><th>Phiếu lương</th></tr></thead><tbody>${rows.map(e=>{const m=monthOf(e),a=allowOf(e),o=OTof(e);return `<tr class="click" data-a="ov:pay:${e.code}"><td>${who(e,e.code)}</td><td class="sub">${e.title}${e.contract==='Thử việc'?' <span class="badge violet" style="margin-left:6px">Thử việc 85%</span>':''}</td><td class="r num">${money(e.base)}</td><td class="r num sub">${money(a)}</td><td class="r num sub">${o?money(o):'<span class="muted">—</span>'}</td><td class="r num">${e.code==='2402'?'<span style="color:var(--warn);font-weight:600">3.000.000 ₫</span>':'<span class="muted">—</span>'}</td><td class="r num strong">${money(e.base+a+o)}</td><td>${m.miss?`<span class="pill warn">Cần rà soát</span>`:`<span class="pill ok">Đủ dữ liệu</span>`}</td><td class="act" data-self="1"><button class="dlbtn" data-a="toast:Prototype: chưa tải phiếu lương thật" aria-label="Tải phiếu lương của ${e.name}">${ic('download',15)}Tải về</button></td></tr>`}).join('')||`<tr><td colspan="9" class="sub" style="padding:28px;text-align:center">Không có nhân viên phù hợp.</td></tr>`}</tbody></table></div>
  ${pagerHTML('lpg',pg,np,l.length,PER,'nhân viên')}`}
const _luong=PAGES.luong;
PAGES.luong=()=>{const t=curTab('luong','sheet');if(t!=='sheet')return _luong();
  const need=E.filter(e=>monthOf(e).miss||!e.base),tb=E.reduce((a,e)=>a+e.base,0),ta=E.reduce((a,e)=>a+allowOf(e),0),mo=n=>Math.round(n).toLocaleString('vi-VN')+'<small> ₫</small>',f=curTab('lf','all');
  const acts=btn('Xuất Excel','toast:Đã xuất bảng lương đầu vào','','download')+btn('Chốt bảng','ov:lockpay','pri','lock');
  return `${head('Lương & tạm ứng','Kỳ lương 11/2026. Bảng lương lấy công từ bảng công đã khóa và mức lương theo ngày hiệu lực.',acts)}${tabs('luong',[['sheet','Bảng lương kỳ này'],['rate','Mức lương'],['allow','Khoản phụ cấp',ALLOW.filter(a=>a[6]).length],['calc','Tính thử lương']])}
  <div class="thks">${thk('Quỹ lương cứng',mo(tb+ta),'+2,1% so với tháng 10','ok','wallet')}${thk('Lương cơ bản bình quân',mo(tb/E.length),'+0,8% so với tháng 10','ok','users')}${thk('Tổng phụ cấp',mo(ta),`${Math.round(ta/(tb+ta)*100)}% quỹ lương cứng`,'','calc')}${thk('Tạm ứng chờ duyệt',mo(3000000),'1 đơn, TU-0001','warn','approve','req:TU-0001')}</div>
  <div class="grid pgrid"><section class="card"><div class="hd"><h3>Tổng quan quỹ lương</h3><span class="small sub">Năm 2026, đơn vị triệu ₫</span></div><div class="bd"><div class="lgd"><span><i style="background:#3BC39E"></i>Lương cứng</span><span><i style="background:#0F5C46"></i>Phụ cấp</span><span><i style="background:#F2A93B"></i>Làm thêm</span></div>${payChart()}</div></section>
  <section class="card"><div class="hd"><h3>Cơ cấu quỹ lương</h3><span class="small sub">Tháng 11/2026</span></div><div class="bd">${payMix()}</div></section></div>
  <section class="card"><div class="hd"><h3>Bảng lương nhân viên</h3><div class="row wrap"><div class="inwrap">${ic('search',16)}<input class="input" id="lsq" data-in="lsq" placeholder="Tìm tên, mã, chức danh…" aria-label="Tìm nhân viên" value="${esc(S.lsq||'')}"></div><select class="select input" id="lsf" data-in="lsf" style="width:auto;height:40px" aria-label="Lọc"><option value="all" ${f==='all'?'selected':''}>Tất cả (${E.length})</option><option value="need" ${f==='need'?'selected':''}>Cần rà soát (${need.length})</option><option value="trial" ${f==='trial'?'selected':''}>Thử việc (${E.filter(e=>e.contract==='Thử việc').length})</option></select></div></div><div id="payRegion">${payTable()}</div></section>`};

/* ---------- Nghỉ phép: Tổng quan ---------- */
function leaveRanges(){const out=[];E.forEach(e=>{const days=[];for(let d=1;d<=TODAY;d++)if(dayStatus(e,d)==='leave')days.push([d,'a']);FUT.forEach(f=>{if(f[0]===e.code)days.push([f[1],f[2]])});days.sort((a,b)=>a[0]-b[0]);let cur=null;days.forEach(([d,s])=>{if(cur&&d===cur.to+1&&s===cur.st&&!(isWE(d)))cur.to=d,cur.n++;else{if(cur)out.push(cur);cur={e,from:d,to:d,n:1,st:s}}});if(cur)out.push(cur)});return out.map(r=>({...r,state:r.st==='p'?'pend':r.to<TODAY?'past':r.from<=TODAY?'now':'soon'})).sort((a,b)=>a.from-b.from)}
const LSTAT={pend:['Chờ duyệt','warn'],past:['Đã nghỉ',''],now:['Đang nghỉ','ok'],soon:['Đã duyệt','ok']};
function leaveBars(){const days=[...Array(30)].map((_,k)=>k+1),cnt=days.map(d=>leaveOn(d).length),m0=Math.max(4,...cnt),mx=m0+m0%2;
  return `<div class="lbars" role="img" aria-label="Số người nghỉ mỗi ngày trong tháng 11"><div class="yax">${[mx,mx/2,0].map(v=>`<span>${v}</span>`).join('')}</div><div class="cols">${days.map((d,i)=>{const l=leaveOn(d),pend=l.some(x=>x.st==='p'),c=cnt[i],cls=d===TODAY?'now':d>TODAY?(pend?'pend':'soon'):'past';return `<button class="lbc ${cls} ${isWE(d)?'we':''}" data-a="lday:${d}" title="Ngày ${d}/11: ${c} người nghỉ"><span class="bar" style="height:${c?Math.max(8,c/mx*100):0}%"></span><span class="dl ${[1,5,10,13,15,20,25,30].includes(d)?'':'h'}">${d}</span></button>`}).join('')}</div></div>
  <div class="lgd" style="margin-top:12px"><span><i style="background:var(--brand-soft-2,#BFE6D3)"></i>Đã qua</span><span><i style="background:var(--brand)"></i>Hôm nay</span><span><i style="background:var(--mint)"></i>Đã duyệt</span><span><i style="background:var(--warn-fill)"></i>Chờ duyệt</span></div>`}
function miniCal(){const lead=(new Date(2026,10,1).getDay()+6)%7,sel=leaveOn(S.lday);
  const cells=[...Array(lead)].map(()=>'<span></span>').join('')+[...Array(30)].map((_,k)=>{const d=k+1,l=leaveOn(d),pend=l.some(x=>x.st==='p');return `<button class="mc ${isWE(d)?'we':''} ${d===TODAY?'today':''} ${d===S.lday?'sel':''} ${l.length?(pend?'has pend':'has'):''}" data-a="lday:${d}" aria-label="Ngày ${d}/11, ${l.length} người nghỉ">${d}${l.length?`<i>${l.length}</i>`:''}</button>`}).join('');
  return `<div class="mcal"><b>T2</b><b>T3</b><b>T4</b><b>T5</b><b>T6</b><b class="we">T7</b><b class="we">CN</b>${cells}</div>
  <div class="mday"><span class="cap">${S.lday===TODAY?'Hôm nay':'Ngày '+S.lday+'/11'}</span>${sel.length?`<div class="mnames">${sel.slice(0,4).map(x=>`<button data-a="ov:leave:${x.e.code}">${av(x.e,'s')}<span>${given(x.e.name)}</span></button>`).join('')}${sel.length>4?`<span class="more">+${sel.length-4}</span>`:''}</div>`:`<span class="sub small">${isWE(S.lday)?'Ngày nghỉ hằng tuần':'Không ai nghỉ'}</span>`}</div>`}
const _np2=PAGES['nghi-phep'];
PAGES['nghi-phep']=()=>{const t=S.tab.np||'ov';if(t!=='ov')return _np2();
  const tot=E.reduce((a,e)=>a+grantOf(e),0),used=E.reduce((a,e)=>a+usedOf(e),0),pend=2,left=tot-used-pend,nowN=leaveOn(TODAY).length,f=curTab('npf','all'),R=leaveRanges().filter(r=>f==='all'||(f==='now'&&r.state==='now')||(f==='soon'&&(r.state==='soon'||r.state==='pend'))||(f==='pend'&&r.state==='pend')),rq=REQS.find(q=>q.id==='NP-0002'),PER=rpp(),np=Math.max(1,Math.ceil(R.length/PER)),pg=Math.min(Math.max(1,+curTab('npg','1')),np),RP=R.slice((pg-1)*PER,pg*PER);
  const pct=v=>vn(v/tot*100)+'%';
  return `${head('','Phép năm 2026 tích lũy theo tháng, 12 ngày/năm theo quy định PN-CHUAN.',btn('Quy định phép năm','set:qd','','gear'))}
  ${tabs('np',[['ov','Tổng quan'],['cal','Lịch nghỉ'],['bal','Số dư phép',30]])}
  <div class="thks">${thk('Đang nghỉ hôm nay',`${nowN}<small> người</small>`,leaveOn(TODAY).map(x=>given(x.e.name)).join(', ')||'Không ai nghỉ','mint','leave','lday:13')}${thk('Phép còn lại toàn công ty',`${left}<small> ngày</small>`,`Đã cấp ${tot} ngày`,'','cal')}${thk('Đã sử dụng',`${used}<small> ngày</small>`,`${pct(used)} số phép đã cấp`,'ok','approve')}${thk('Đơn nghỉ chờ duyệt','1<small> đơn</small>','NP-0002, 2 ngày','warn','clock','req:NP-0002')}</div>
  <div class="grid lgrid"><section class="card"><div class="hd"><h3>Số người nghỉ mỗi ngày</h3><span class="small sub">Tháng 11/2026</span></div><div class="bd">${leaveBars()}</div></section>
  <section class="card"><div class="hd"><h3>Lịch tháng 11</h3><button class="btn ghost sm" data-a="tab:np:cal">Xem đầy đủ</button></div><div class="bd">${miniCal()}</div></section>
  <section class="card"><div class="hd"><h3>Phép năm 2026</h3><span class="small sub">${tot} ngày đã cấp</span></div><div class="bd"><div class="dn-w">${donut([[used,'var(--t-np-fill)'],[pend,'var(--warn-fill)'],[left,'var(--mint)']],168,`<b style="font-size:28px">${left}</b><span>ngày còn lại</span>`)}</div>
   <div class="dleg">${[['Còn lại',left,'var(--mint)'],['Đã nghỉ',used,'var(--t-np-fill)'],['Chờ duyệt',pend,'var(--warn-fill)']].map(([l,v,c])=>`<div><span class="sq" style="background:${c}"></span><span class="lb">${l}</span><b class="num">${v} ngày</b><span class="pc num">${pct(v)}</span></div>`).join('')}</div></div></section></div>
  <section class="card"><div class="hd"><h3>Hoạt động nghỉ phép</h3><div class="row wrap">${[['all','Tất cả'],['now','Đang nghỉ'],['soon','Sắp tới'],['pend','Chờ duyệt']].map(([k,l])=>`<button class="fchip ${f===k?'on':''}" data-a="filt:npf:${k}">${l}</button>`).join('')}</div></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Nhân viên</th><th>Phòng ban</th><th>Loại</th><th>Thời gian</th><th class="r">Số ngày</th><th>Lý do</th><th>Trạng thái</th><th></th></tr></thead><tbody>${RP.map(r=>{const st=LSTAT[r.state],rg=r.from===r.to?`${r.from}/11`:`${r.from}/11 – ${r.to}/11`,isq=r.e.code==='2416';return `<tr class="click" data-a="ov:leave:${r.e.code}"><td>${who(r.e,r.e.code)}</td><td class="sub">${deptName(r.e.dept)}</td><td>${rtype('NP')}</td><td class="num">${rg}</td><td class="r num strong">${r.n}</td><td class="sub">${isq?rq.reason:'Phép năm'}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td class="act" data-self="1">${r.state==='pend'?`<button class="dlbtn" data-a="req:NP-0002">${ic('approve',15)}Xem và duyệt</button>`:`<span class="muted">${ic('chevR',16)}</span>`}</td></tr>`}).join('')||`<tr><td colspan="8" class="sub" style="padding:28px;text-align:center">Chưa có lịch nghỉ phù hợp.</td></tr>`}</tbody></table></div>
  ${pagerHTML('npg',pg,np,R.length,PER,'lượt nghỉ')}</section>`};

boot();
</script>
