project_id = "kavor-system"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**", "kavor://**"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Dải cổng 553xx để chạy song song với project Supabase local khác trên cùng máy
[local_smtp]
enabled = true
port = 55324
# SMTP của Mailpit để API gửi thư mời kích hoạt khi chạy local
smtp_port = 55325

[analytics]
enabled = false
port = 55327

[db.pooler]
enabled = false
port = 55329

# MFA TOTP: bắt buộc cho tài khoản dùng web HR/Admin (ADR 0001)
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 300
max_frequency = "30s"

# OTP kích hoạt / quên mật khẩu dùng luồng email OTP (magic link) của Supabase Auth
[auth.email.template.magic_link]
subject = "Mã xác thực Kavor"
content_path = "./supabase/templates/otp.html"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30
