project_id = "kavor-system"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**", "kavor://**"]
jwt_expiry = 3600
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Dải cổng 553xx để chạy song song với project Supabase local khác trên cùng máy
[local_smtp]
enabled = true
port = 55324

[analytics]
enabled = false
port = 55327

[db.pooler]
enabled = false
port = 55329
