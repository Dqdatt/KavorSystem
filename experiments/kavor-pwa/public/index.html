<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Kavor</title>
    <meta name="description" content="Kavor — Nhân sự trong tầm tay" />
    <meta id="kv-theme" name="theme-color" content="#065F46" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kavor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #065F46; }
      /* iOS web app (mở từ icon) + black-translucent: height 100% hụt đúng safe-area-inset-top so với màn hình, iOS co cả viewport
         theo đó và bỏ trống một dải dưới đáy. 100vh bằng cả màn hình → viewport (innerHeight) và #root phủ kín tới mép dưới. */
      @media (display-mode: standalone) { html, body { height: 100vh; } }
      #root { display: flex; position: fixed; inset: 0; }
      #boot-splash { position: fixed; inset: 0; z-index: 2147482000; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 22% 16%, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 60%), linear-gradient(155deg, #12976F 0%, #065F46 62%, #044E39 100%);
        transition: opacity .25s ease; }
      #boot-splash.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <noscript>Bật JavaScript để dùng Kavor.</noscript>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <svg width="112" height="100" viewBox="16 16 439 393"><path d="M35 189 L35 389 L141 190 L245 390 L436 35" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/><circle cx="364" cy="374" r="32" fill="#FFFFFF"/></svg>
    </div>
  </body>
</html>
